[project]
name = "pyday-la-plata-ejemplos"
version = "0.1.0"
description = "Ejemplos ejecutables de software científico e IA para PyDay La Plata 2026"
requires-python = ">=3.12"
dependencies = ["matplotlib>=3.9,<4"]

[dependency-groups]
dev = ["pytest>=8,<10", "hypothesis>=6,<7"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
