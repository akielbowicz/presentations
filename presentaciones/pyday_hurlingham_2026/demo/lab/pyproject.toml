[project]
name = "muestreo"
version = "0.1.0"
description = "Qué sample rate necesita una medición según su dinámica (sensor-log)"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
muestreo = "muestreo.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["uv_build>=0.9"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "muestreo"

[tool.pytest.ini_options]
testpaths = ["tests"]
