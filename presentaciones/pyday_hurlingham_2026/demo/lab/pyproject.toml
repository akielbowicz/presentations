[project]
name = "conocimiento"
version = "0.1.0"
description = "Laboratorio: documentos → conocimiento estructurado con evidencia."
readme = "README.md"
authors = [
    { name = "akielbowicz", email = "augusto.kiel@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "rich>=15.0.0",
]

[project.scripts]
conocimiento = "conocimiento.cli:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
